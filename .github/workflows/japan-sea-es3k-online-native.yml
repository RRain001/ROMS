          root=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"
          raw=json.loads((root/"ud1k_all_1017_wet_rho_coast_sensitive_candidates.json").read_text())
          report=json.loads((root/"ud1k_perimeter_min_shoreline_cut_review.json").read_text())
