name: ES3K I3 Public GEBCO2026 Native15s GSHHG

on:
  pull_request:
    branches:
      - feature/japan-sea-nesting
    paths:
      - 'ROMS_Nesting/Data_pre/scripts/nesting/fetch_es3k_online_data.py'
      - '.github/workflows/japan-sea-es3k-online-native.yml'
      - 'ROMS_Nesting/Data_pre/nesting/es3k_core_component_filter.py'
      - 'ROMS_Nesting/Data_pre/scripts/nesting/export_es3k_core_mask_candidate.py'
      - 'ROMS_Nesting/Data_pre/nesting/es3k_wet_domain_audit.py'
      - 'ROMS_Nesting/Data_pre/nesting/es3k_core_bathymetry_smoothing.py'
      - 'ROMS_Nesting/Data_pre/scripts/nesting/smooth_es3k_core_candidate.py'
      - 'ROMS_Nesting/configs/es3k_i3_vertical_candidate.json'
      - 'ROMS_Nesting/Data_pre/nesting/es3k_local_slope_projection.py'
      - 'ROMS_Nesting/Data_pre/scripts/nesting/smooth_es3k_local_candidate.py'
      - 'ROMS_Nesting/Data_pre/nesting/validate_nesting_geometries.py'
      - 'ROMS_Nesting/Data_pre/scripts/nesting/compare_ud1k_domains.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_wet_triangle_review.py'
      - 'ROMS_Nesting/Data_pre/scripts/nesting/review_ud1k_wet_triangles.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_wet_triangle_review.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_wet_connected_triangle_review.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_wet_connected_triangle_review.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_coastal_waterpath_fallback.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_coastal_waterpath_fallback.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_boundary_rho_fallback_map.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_boundary_rho_fallback_map.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_full_rho_boundary_map.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_full_rho_boundary_map.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_full_rho_coastline_repair.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_full_rho_coastline_repair.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_boundary_cgrid_velocity.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_boundary_cgrid_velocity.py'
      - 'ROMS_Nesting/Data_pre/scripts/nesting/audit_ud1k_boundary_velocity_support.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_staggered_face_map.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_staggered_face_map.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_vertical_flux_primitives.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_vertical_flux_primitives.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_native_face_component_review.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_native_face_component_review.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_native_face_shoreline_topology.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_native_face_shoreline_topology.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_single_v_face_radius_sensitivity.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_single_v_face_radius_sensitivity.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_connected_core_candidate.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_connected_core_candidate.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_core_rho_mapping_subset.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_perimeter_shoreline_consistency_candidate.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_perimeter_shoreline_consistency_candidate.py'
      - 'ROMS_Nesting/Data_pre/nesting/ud1k_boundary_vertical_flux_geometry_smoke.py'
      - 'ROMS_Nesting/Data_pre/tests/test_ud1k_boundary_vertical_flux_geometry_smoke.py'
      - 'ROMS_Nesting/configs/ud1k_kim2020_table1_trial.json'
      - 'ROMS_Nesting/configs/ud1k_user_20261014_frozen.json'
      - 'ROMS_Nesting/Data_pre/tests/test_es3k_wet_domain_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  es3k-online-native:
    name: Native 15-second GEBCO2026 + GSHHG real mask
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MAX_RETRY: "4"
      GDAL_HTTP_RETRY_DELAY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public raster and grid science dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy scipy netCDF4 pyproj pillow pyshp shapely rasterio requests
      - name: Synthetic 3-wet local triangle and coastline rejection regressions
        run: |
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_wet_triangle_review.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_wet_connected_triangle_review.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_coastal_waterpath_fallback.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_boundary_rho_fallback_map.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_full_rho_boundary_map.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_full_rho_coastline_repair.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_boundary_cgrid_velocity.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_staggered_face_map.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_vertical_flux_primitives.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_native_face_component_review.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_native_face_shoreline_topology.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_single_v_face_radius_sensitivity.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_connected_core_candidate.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_perimeter_shoreline_consistency_candidate.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_boundary_vertical_flux_geometry_smoke.py' -v
          python -m py_compile \
            ROMS_Nesting/Data_pre/nesting/ud1k_wet_triangle_review.py \
            ROMS_Nesting/Data_pre/scripts/nesting/review_ud1k_wet_triangles.py
      - name: Fetch bounded real GEBCO 2026 and GSHHG 2.3.7
        run: |
          python ROMS_Nesting/Data_pre/scripts/nesting/fetch_es3k_online_data.py \
            --output-dir "$RUNNER_TEMP/ES3K_REAL_SOURCE" \
            --resolution-arcsec 15 --coast-resolution h
      - name: Build full geometry ES3K with real topography and shoreline
        run: |
          python ROMS_Nesting/Data_pre/scripts/nesting/create_bathymetry_grid.py \
            --geometry-json ROMS_Nesting/configs/es3k_conformal_candidate.json \
            --bathymetry "$RUNNER_TEMP/ES3K_REAL_SOURCE/GEBCO_2026_ES3K_15sec.nc" \
            --gshhg-base "$RUNNER_TEMP/ES3K_REAL_SOURCE/GSHHS_shp" \
            --gshhg-resolution h \
            --output "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_GEBCO2026_GSHHG237_CANDIDATE.nc" \
            --report-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_i3_grid_report.json"
      - name: Audit actual wet cells, Yellow Sea proxy, four straits and boundaries
        run: |
          python ROMS_Nesting/Data_pre/scripts/nesting/audit_es3k_wet_domain.py \
            --grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_GEBCO2026_GSHHG237_CANDIDATE.nc" \
            --report-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_es3k_wet_domain_audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"
          manifest=json.loads((root/"online_source_manifest.json").read_text())
          d=json.loads((root/"real_es3k_wet_domain_audit.json").read_text())
          assert manifest["GEBCO"]["data_class"]=="REAL_PUBLIC_GEBCO_2026_ELEVATION"
          assert manifest["GSHHG"]["GSHHG_version"]=="2.3.7"
          assert d["rho_shape_eta_xi"]==[732,464]
          assert d["I3_physics_acceptance"]=="NOT_RUN"
          assert d["input_provenance"]["synthetic_test_only"]=="FALSE"
          assert d["input_provenance"]["shoreline_status"]=="GSHHG_L1_INTERSECTED_WITH_GEBCO"
          report={
            "status":"REAL_ONLINE_GEBCO2026_GSHHG237_WET_GRID_DIAGNOSTIC_ONLY",
            "grid_shape":d["rho_shape_eta_xi"],
            "total_wet_rho_points":d["wet_rho_points"],
            "wet_area_km2":d["wet_area_km2_metrics_approx"],
            "west_korea_proxy_wet_points":d["region_diagnostics"]["west_of_korea_yellow_sea_proxy"]["wet_rho_points"],
            "west_korea_proxy_wet_area_km2":d["region_diagnostics"]["west_of_korea_yellow_sea_proxy"]["wet_area_km2_metrics_approx"],
            "strait_connected_to_japan_basin":d["strait_window_connected_to_core"],
            "open_boundaries":d["outer_boundary"],
            "review_flags":d["review_flags"],
            "GEBCO_2026_sampling":"NATIVE 15 arc-second GEBCO 2026 COG pixels",
            "bathymetry_smoothing":"NOT_RUN",
            "ROMS_physics":"NOT_RUN",
            "scientific_I3_pass":False,
            "unsmoothed_rx0_max":json.loads((root/"real_i3_grid_report.json").read_text())["quality"]["rx0_unsmoothed_wet_max"],
            "wet_connected_components":json.loads((root/"real_i3_grid_report.json").read_text())["quality"]["wet_connected_components"],
            "dominant_component_wet_rho_points":d["dominant_component_wet_rho_points"]
          }
          (root/"real_wet_summary.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Export disconnected-only exclusion as separate candidate mask
        run: |
          python ROMS_Nesting/Data_pre/scripts/nesting/export_es3k_core_mask_candidate.py \
            --grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_GEBCO2026_GSHHG237_CANDIDATE.nc" \
            --output "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_MASK_ONLY_CANDIDATE.nc" \
            --report-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_es3k_core_component_filter_report.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"
          a=json.loads((root/"real_es3k_core_component_filter_report.json").read_text())
          assert a["no_existing_shared_wet_face_cut"]
          assert a["derived_yellow_sea_proxy_wet_rho"]==0
          assert all(a["straits_after_filter"].values())
          assert a["retained_core_wet_rho_points"]==193920
          assert a["excluded_noncore_wet_rho_points"]>15000
          assert a["ROMS_physics"]=="NOT_RUN"
          print("MASK_CANDIDATE_ONLY; original GEBCO/GSHHG and ES3K grid unchanged")
          PY
      - name: Smooth core-only ES3K bathymetry with explicit 41 sigma layers
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/smooth_es3k_core_candidate.py \
            --grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_MASK_ONLY_CANDIDATE.nc" \
            --output "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_SMOOTHED_I3_CANDIDATE.nc" \
            --report-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_es3k_core_slope_report.json" \
            --vertical-config ROMS_Nesting/configs/es3k_i3_vertical_candidate.json
          python - <<'PY'
          from pathlib import Path
          from netCDF4 import Dataset
          import json,os,numpy as np
          root=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"
          q=json.loads((root/"real_es3k_core_slope_report.json").read_text())
          assert q["status"]=="ES3K_CORE_SLOPE_PRELIMINARY_PASS_ONLY"
          assert q["rx0_final"]<=.35 and q["rx1_final"]<=8.
          assert abs(q["volume_change_fraction"])<=.02
          assert q["wet_rho_points"]==193920
          a=root/"ES3K_JAPAN_SEA_CORE_MASK_ONLY_CANDIDATE.nc"
          b=root/"ES3K_JAPAN_SEA_CORE_SMOOTHED_I3_CANDIDATE.nc"
          with Dataset(a) as x, Dataset(b) as y:
            for field in ("lon_rho","lat_rho","pm","pn","angle","mask_rho",
                          "mask_u","mask_v","mask_psi","excluded_ocean_component_rho"):
              np.testing.assert_array_equal(x[field][:],y[field][:])
          print("REAL ES3K core slope STATIC GATE PASS, ROMS physics NOT RUN")
          PY
      - name: Compare minimal-change local slope treatment against blanket smoothing
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/smooth_es3k_local_candidate.py \
            --grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_MASK_ONLY_CANDIDATE.nc" \
            --output "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_LOCAL_SLOPE_I3_CANDIDATE.nc" \
            --report-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_es3k_local_slope_report.json" \
            --vertical-config ROMS_Nesting/configs/es3k_i3_vertical_candidate.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          from netCDF4 import Dataset
          import numpy as np
          root=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"
          a=json.loads((root/"real_es3k_core_slope_report.json").read_text())
          b=json.loads((root/"real_es3k_local_slope_report.json").read_text())
          assert b["status"]=="LOCAL_ES3K_CORE_SLOPE_STATIC_PASS_PHYSICS_NOT_RUN"
          x=b["selected"]
          assert x["rx0"]<=.35 and x["rx1"]<=8 and x["meets_p99_depth"]
          source=root/"ES3K_JAPAN_SEA_CORE_MASK_ONLY_CANDIDATE.nc"
          local=root/"ES3K_JAPAN_SEA_CORE_LOCAL_SLOPE_I3_CANDIDATE.nc"
          blanket=root/"ES3K_JAPAN_SEA_CORE_SMOOTHED_I3_CANDIDATE.nc"
          with Dataset(source) as src,Dataset(local) as loc,Dataset(blanket) as full:
            wet=np.asarray(src["mask_rho"][:],dtype=bool)
            base=np.asarray(src["h"][:])
            h_loc=np.asarray(loc["h"][:])
            h_full=np.asarray(full["h"][:])
            p99_full=float(np.quantile(np.abs(h_full[wet]-base[wet]),.99))
            max_full=float(np.max(np.abs(h_full[wet]-base[wet])))
            assert x["max_abs_depth_change_m"] < max_full, "local smoothing must reduce peak depth distortion"
            assert x["p99_abs_depth_change_m"] < p99_full, "local smoothing must reduce P99 distortion"
            for field in ("lon_rho","lat_rho","pm","pn","angle","mask_rho",
                          "mask_u","mask_v","mask_psi","excluded_ocean_component_rho"):
              np.testing.assert_array_equal(src[field][:],loc[field][:])
          record={
            "status":"LOCAL_SLOPE_STATIC_COMPARISON_PASS_ONLY",
            "local_selected":x,
            "blanket_rx0":a["rx0_final"],
            "blanket_rx1":a["rx1_final"],
            "blanket_max_depth_change_m":max_full,
            "blanket_p99_depth_change_m":p99_full,
            "local_alternative_reduces_max_and_p99_distortion":True,
            "physical_acceptance":"NOT_RUN"
          }
          (root/"real_es3k_smoothing_comparison.json").write_text(json.dumps(record,indent=2)+"\n")
          print(json.dumps(record,indent=2))
          PY
      - name: Generate real UD1K 1/108-degree candidate on matching sources
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/create_bathymetry_grid.py \
            --geometry-json ROMS_Nesting/configs/ud1k_candidate.json \
            --bathymetry "$RUNNER_TEMP/ES3K_REAL_SOURCE/GEBCO_2026_ES3K_15sec.nc" \
            --gshhg-base "$RUNNER_TEMP/ES3K_REAL_SOURCE/GSHHS_shp" \
            --gshhg-resolution h \
            --output "$RUNNER_TEMP/ES3K_REAL_SOURCE/UD1K_GEBCO2026_GSHHG237_I3_CANDIDATE.nc" \
            --report-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_ud1k_grid_report.json"
      - name: Real ES3K smoothed core to UD1K wet-boundary preflight
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/validate_nesting_geometries.py \
            --parent-grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_SMOOTHED_I3_CANDIDATE.nc" \
            --child-grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/UD1K_GEBCO2026_GSHHG237_I3_CANDIDATE.nc" \
            --parent-margin-cells 2 \
            --output-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_es3k_ud1k_preflight.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"
          x=json.loads((root/"real_es3k_ud1k_preflight.json").read_text())
          assert x["status"]=="PASS_PRELIMINARY_ONLY"
          assert x["parent_synthetic"]=="FALSE" and x["child_synthetic"]=="FALSE"
          assert x["conservative_boundary_fluxes"]=="NOT_RUN"
          s=x["full_wet_parent_quad_stencil"]
          assert s["child_wet_boundary_rho_points"]==x["wet_boundary_points_checked"]
          assert s["with_full_wet_parent_rho_quad"]+s["without_full_wet_parent_rho_quad"]==s["child_wet_boundary_rho_points"]
          assert s["physical_velocity_rotation_vertical_remap_and_flux"]=="NOT_RUN"
          print("Parent all-wet quad stencil diagnostic:",json.dumps(s,indent=2))
          print("REAL WET-BOUNDARY STATIC PREFLIGHT PASS, WATER DYNAMICS NOT RUN")
          PY
      - name: Compare frozen user UD1K against Kim 2020 Table 1 published domain
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/create_bathymetry_grid.py \
            --geometry-json ROMS_Nesting/configs/ud1k_kim2020_table1_trial.json \
            --bathymetry "$RUNNER_TEMP/ES3K_REAL_SOURCE/GEBCO_2026_ES3K_15sec.nc" \
            --gshhg-base "$RUNNER_TEMP/ES3K_REAL_SOURCE/GSHHS_shp" \
            --gshhg-resolution h \
            --output "$RUNNER_TEMP/ES3K_REAL_SOURCE/UD1K_KIM2020_TABLE1_REAL_CANDIDATE.nc" \
            --report-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_ud1k_kim2020_grid_report.json"
          python ROMS_Nesting/Data_pre/scripts/nesting/compare_ud1k_domains.py \
            --parent-grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_SMOOTHED_I3_CANDIDATE.nc" \
            --current-grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/UD1K_GEBCO2026_GSHHG237_I3_CANDIDATE.nc" \
            --paper-grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/UD1K_KIM2020_TABLE1_REAL_CANDIDATE.nc" \
            --current-config ROMS_Nesting/configs/ud1k_user_20261014_frozen.json \
            --paper-config ROMS_Nesting/configs/ud1k_kim2020_table1_trial.json \
            --current-preflight "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_es3k_ud1k_preflight.json" \
            --output-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/ud1k_current_vs_kim2020_table1_real_comparison.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"/"ud1k_current_vs_kim2020_table1_real_comparison.json"
          data=json.loads(p.read_text())
          cases=data["cases"]
          assert cases["CURRENT_USER_20261014"]["rho_shape_eta_xi"]==[290,438]
          assert cases["KIM2020_TABLE1"]["rho_shape_eta_xi"]==[379,703]
          assert data["physical_validation"]=="NOT_RUN"
          s=data["comparison_summary"]
          print("PAPER_BOUNDARY_COMPARISON: "+
                json.dumps(s,sort_keys=True,ensure_ascii=False))
          PY
      - name: Real 27-point current UD1K local wet-triangle and GSHHG audit
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/review_ud1k_wet_triangles.py \
            --parent-grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/ES3K_JAPAN_SEA_CORE_SMOOTHED_I3_CANDIDATE.nc" \
            --child-grid "$RUNNER_TEMP/ES3K_REAL_SOURCE/UD1K_GEBCO2026_GSHHG237_I3_CANDIDATE.nc" \
            --preflight-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/real_es3k_ud1k_preflight.json" \
            --gshhg-base "$RUNNER_TEMP/ES3K_REAL_SOURCE/GSHHS_shp" \
            --gshhg-resolution h \
            --output-json "$RUNNER_TEMP/ES3K_REAL_SOURCE/ud1k_current_27_coastal_triangle_review.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"ES3K_REAL_SOURCE"/"ud1k_current_27_coastal_triangle_review.json"
          r=json.loads(p.read_text())
          assert len(r["records"])==27 and sum(r["status_counts"].values())==27
          assert r["source_masks_modified"] is False and r["physical_validation"]=="NOT_RUN"
          print("TRIANGLE_BARYCENTRIC_GSHHG_27_REAL_COUNTS",json.dumps(r["status_counts"],sort_keys=True))
          PY
      - name: Second-tier real 22-point connected 3x3 wet triangle GSHHG audit
        shell: bash
        run: |
          set -euo pipefail
