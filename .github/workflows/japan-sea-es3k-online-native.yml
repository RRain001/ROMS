          coast=json.loads((root/"ud1k_core_shoreline_clear_face_topology.json").read_text())
          with Dataset(root/"UD1K_CONNECTED_CORE_SHORELINE_CLEAR_COMPARISON_CANDIDATE.nc") as f:
              wet=np.asarray(f["mask_rho"][:],dtype=bool)
          selected=[r for r in raw["all_1017_mapped_RHO_records"]
                    if wet[int(r["child_eta_rho_zero_based"]),int(r["child_xi_rho_zero_based"])]]
          kept={(int(r["child_eta_rho_zero_based"]),int(r["child_xi_rho_zero_based"])) for r in selected}
          omitted=sorted([
              (int(r["child_eta_rho_zero_based"]),int(r["child_xi_rho_zero_based"]))
              for r in raw["all_1017_mapped_RHO_records"]
              if (int(r["child_eta_rho_zero_based"]),int(r["child_xi_rho_zero_based"])) not in kept])
          assert len(selected)==1011
          assert omitted==[(0,27),(0,28),(0,30),(0,40),(0,42),(23,437)]
          assert report["minimal_removed_RHO_eta_xi_zero_based"]==[[0,40],[0,42],[23,437]]
          assert report["source_candidate_was_modified"] is False
          assert report["all_RHO_wet_components_preserved_as_one"] is True
          assert uv["reports"]["u"]["native_wet_boundary_face_count"]==1005
          assert uv["reports"]["v"]["native_wet_boundary_face_count"]==1010
          assert uv["reports"]["u"]["unresolved_face_receivers"]==0
          assert uv["reports"]["v"]["unresolved_face_receivers"]==0
          assert coast["reports"]["u"]["wet_face_RHO_to_RHO_segment_crosses_GSHHG_count"]==0
          assert coast["reports"]["v"]["wet_face_RHO_to_RHO_segment_crosses_GSHHG_count"]==0
          subset={
              "scope":"OPTIONAL_CORE_SHORELINE_CLEAR_UD1K_1011_WET_RHO_RECEIVERS",
              "all_1011_source_RHO_weights_identical_to_original_1017_mapping":True,
              "dropped_original_boundary_RHO_eta_xi":omitted,
              "original_main_and_original_ud1k_grid_untouched":True,
              "actual_steady_3d_ROMs_bry_and_flux":"NOT_RUN",
              "records":selected,
          }
          (root/"ud1k_core_shoreline_clear_1011_rho_map.json").write_text(json.dumps(subset,indent=2)+"\n")
          print("UD1K_CORE_PLUS_SHORELINE_ZERO_STATIC_CGRID_HOLDS",json.dumps({
              "rho":len(selected),
              "u":uv["reports"]["u"]["native_wet_boundary_face_count"],
              "v":uv["reports"]["v"]["native_wet_boundary_face_count"],
              "u_no_donor":uv["reports"]["u"]["unresolved_face_receivers"],
              "v_no_donor":uv["reports"]["v"]["unresolved_face_receivers"],
              "u_segments_cross_shoreline":coast["reports"]["u"]["wet_face_RHO_to_RHO_segment_crosses_GSHHG_count"],
              "v_segments_cross_shoreline":coast["reports"]["v"]["wet_face_RHO_to_RHO_segment_crosses_GSHHG_count"],
              "hydrodynamic_acceptance":"NOT_RUN",
          },sort_keys=True))
          PY
