name: Japan Sea Nesting I2-I3 Grid Preprocessing

on:
  push:
    branches:
      - feature/japan-sea-nesting
    paths:
      - 'ROMS_Nesting/Data_pre/**'
      - 'ROMS_Nesting/configs/**'
      - '.github/workflows/japan-sea-nesting-i3-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i3-synthetic-grid:
    name: Rotated ES3K / unrotated UD1K candidate fixture gate
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical grid dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy netCDF4 pyproj pillow pyshp shapely matplotlib
      - name: Guarantee old single-grid code is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:Data_pre)" = "95c1143f079e6a70143a0840e94ebe063ef6d29f"
          test "$(git rev-parse HEAD:ROMS_Build)" = "f14572866c49373c792598a56fefbe27afd07c11"
          test "$(git rev-parse HEAD:ROMS_Run)" = "29b27190340080a9bf4937264b86e9221b06f377"
          test "$(git rev-parse HEAD:roms_src/roms)" = "278b82148d31f9ffe01193560e959e0e95aebd62"
      - name: Geodesic metrics and rotated geometry regressions
        run: |
          set -euo pipefail
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_grid_metrics.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_nesting_rotation.py' -v
      - name: Actual bathymetry and candidate ROMS NetCDF integration
        run: |
          set -euo pipefail
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_bathymetry_grid.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_gebco_bounded_read.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_real_gebco_contract.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_glorys_dynamic_sigma.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_glorys_bounded_time.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_nesting_pair_preflight.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_l3_square.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_ud1k_user_bounds.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_es3k_user_corners.py' -v
          python -m unittest discover -s ROMS_Nesting/Data_pre/tests -p 'test_es3k_transfinite.py' -v
      - name: Generate user-corner-constrained ES3K geometric diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/render_es3k_corner_grid.py --sample-scale 20 --output "$RUNNER_TEMP/I2_ES3K_DIAGNOSTIC"
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ["RUNNER_TEMP"])/"I2_ES3K_DIAGNOSTIC"
          report=json.loads((root/"ES3K_four_corner_quality.json").read_text())
          assert report["corner_max_wgs84_error_m"] < 1e-5
          assert report["corner_input_lat_lon"]["W"] == [37.821077,121.9]
          assert report["ROMS_integration"]=="NOT_RUN"
          assert report["sampling_interpretation"]=="LOCAL_METRIC_EQUIVALENT_NOT_EXACT_ANGULAR"
          assert 0 <= report["orthogonality_error_max_deg"] < 90
          for ext in ("svg","png"):
              assert (root/("ES3K_four_corner_CANDIDATE."+ext)).stat().st_size>1000
          print("ES3K FOUR CORNERS FIXED; curvilinear I2 SCIENTIFIC PASS NOT ASSUMED")
          PY
      - name: Persist explicit synthetic ES3K and UD1K NetCDF candidates
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/tests/create_i3_ci_artifacts.py --output "$RUNNER_TEMP/I3_SYNTHETIC"
          python - <<'PY'
          from pathlib import Path
          from netCDF4 import Dataset
          import os
          root=Path(os.environ["RUNNER_TEMP"])/"I3_SYNTHETIC"
          for key in ("ES3K","UD1K"):
              with Dataset(root/(key+"_SYNTHETIC_CANDIDATE.nc")) as ds:
                  assert ds.geometry_status=="CANDIDATE_NOT_VALIDATED_FOR_ROMS"
                  assert ds.synthetic_test_only=="TRUE"
                  assert "h" in ds.variables and "angle" in ds.variables
          import json
          pair=json.loads((root/"I3_Synthetic_Report.json").read_text())["synthetic_pair_preflight"]
          assert pair["status"]=="PASS_PRELIMINARY_ONLY"
          assert pair["conservative_boundary_fluxes"]=="NOT_RUN"
          print("I3 SYNTHETIC NESTED GEOMETRY PASS; physical I3/I5 NOT RUN")
          PY
      - name: Smooth actual candidate h without changing geometry or wet mask
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/I3_SYNTHETIC"
          python ROMS_Nesting/Data_pre/scripts/bathymetry/smooth_bathymetry.py \
            --case-name JAPAN_SEA --case-root "$RUNNER_TEMP/JAPAN_SEA_I3" \
            --grid "$root/ES3K_SYNTHETIC_CANDIDATE.nc" \
            --output "$root/ES3K_SYNTHETIC_CANDIDATE_smoothed.nc" \
            --rx0-target 0.35 --rx1-target 8.0
          python - <<'PY'
          from pathlib import Path
          from netCDF4 import Dataset
          import numpy as np,os,json
          root=Path(os.environ["RUNNER_TEMP"])/"I3_SYNTHETIC"
          a=root/"ES3K_SYNTHETIC_CANDIDATE.nc"
          b=root/"ES3K_SYNTHETIC_CANDIDATE_smoothed.nc"
          with Dataset(a) as x, Dataset(b) as y:
              assert y.geometry_status=="CANDIDATE_NOT_VALIDATED_FOR_ROMS"
              assert y.bathymetry_smoothing_status=="CANDIDATE_RX0_RX1_PASSED_NOT_PHYSICS_VERIFIED"
              assert y.final_rx0 <= 0.35 and y.final_rx1 <= 8.0
              for key in ("pm","pn","angle","lon_rho","lat_rho","mask_rho",
                          "mask_u","mask_v","mask_psi"):
                  np.testing.assert_array_equal(x[key][...],y[key][...])
              assert y["h"].shape==x["h"].shape
              print(json.dumps(dict(status="SYNTHETIC_SLOPE_QC_PASS_ONLY",
                                    rx0=float(y.final_rx0),rx1=float(y.final_rx1),
                                    iterations=int(y.smoothing_iterations))))
          PY
      - name: Archive user-anchored L3 square with synthetic bathymetry only
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/tests/create_l3_ci_artifacts.py --output "$RUNNER_TEMP/I6_SYNTHETIC"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"I6_SYNTHETIC"/"L3_geometry_preflight.json"
          x=json.loads(p.read_text())
          assert x["geometry"]["rho_shape"]==[143,176]
          assert x["parent_child_geometric_preflight"]["status"]=="PASS_PRELIMINARY_ONLY"
          assert x["real_GEBCO_and_GSHHG"]=="NOT_RUN"
          print("USER L3 GEOMETRY CANDIDATE PASS; ACTUAL ROMS/HTO NOT RUN")
          PY
      - name: Export three-grid user-approved geographic schematic
        shell: bash
        run: |
          set -euo pipefail
          python ROMS_Nesting/Data_pre/scripts/nesting/render_three_grid_schematic.py --output "$RUNNER_TEMP/I6_SCHEMATIC"
          python - <<'PY'
          from pathlib import Path
          import json, os
          p=Path(os.environ["RUNNER_TEMP"])/"I6_SCHEMATIC"
          x=json.loads((p/"three_grid_geometry_preflight.json").read_text())
          assert 50 < x["L3"]["south_boundary_gap_km"] < 60
          assert x["UD1K"]["rho_shape"] == [290,438]
          assert x["UD1K"]["grid_spacing_policy"] == "ANCHOR_WEST_SOUTH_EXACT_1_OVER_108_ROUNDED_DMS"
          assert x["UD1K"]["actual_lon_step_deg"] == 1/108
          assert x["UD1K"]["actual_lat_step_deg"] == 1/108
          assert abs(x["UD1K"]["east_dms_rounding_offset_arcsec"]) < 0.05
          assert abs(x["UD1K"]["north_dms_rounding_offset_arcsec"]) < 0.05
          assert abs(x["UD1K"]["lat_south_grid"]-34.96547222222222)<1e-10
          assert abs(x["UD1K"]["lon_min"]-128.36552777777777)<1e-10
          assert x["UD1K"]["geometry_approval"]=="USER_APPROVED"
          assert x["L3"]["GSHHG_wet_mask"]=="NOT_RUN"
          assert x["parent_child_Bq_flux_conservation"]=="NOT_RUN"
          for ext in ("png","svg"):
              assert (p/f"Japan_Sea_Three_Grids_CANDIDATE.{ext}").stat().st_size > 1000
          print("THREE GRID SCHEMATIC / APPROVED GEOMETRY PASS, real GSHHG and ROMS NOT RUN")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i2-es3k-user-corners-transfinite-diagnostic
          path: ${{ runner.temp }}/I2_ES3K_DIAGNOSTIC/
          if-no-files-found: warn
          retention-days: 21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i6-geometry-schematic-png-svg-json
          path: ${{ runner.temp }}/I6_SCHEMATIC/
          if-no-files-found: warn
          retention-days: 21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i6-user-l3-square-synthetic-offshore
          path: ${{ runner.temp }}/I6_SYNTHETIC/
          if-no-files-found: warn
          retention-days: 21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i3-synthetic-es3k-ud1k-candidate
          path: ${{ runner.temp }}/I3_SYNTHETIC/
          if-no-files-found: warn
          retention-days: 14
